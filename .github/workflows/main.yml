name: Daily EPSS Fetch

permissions:
  contents: write  
  
on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:  # per lanciarlo anche a mano da GitHub

jobs:
  run-epss-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # o la versione che preferisci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run EPSS historical fetch
        run: |
          python fetch_data.py
      
      - name: Commit and push EPSS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cache_epss/*.csv || echo "No CSV files to add"
          git add team_history.csv || echo "team_history.csv not found"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EPSS cache $(date -u +'%Y-%m-%d') [skip ci]"
            git push
          fi
